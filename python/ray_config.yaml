# Note that we leave cluster_name blank, so that it will be filled in by the CLI.

min_workers: 1
max_workers: 200
upscaling_speed: 5.0

docker:
  image: "public.ecr.aws/anyscale/ray:2.35.0-slim"
  container_name: "ray_container"
  pull_before_run: True
  run_options:
    - --ulimit nofile=65535:65535
idle_timeout_minutes: 60
provider:
  type: aws
  region: us-east-1
  cache_stopped_nodes: False
  use_internal_ips: True
auth:
  ssh_private_key: ~/.ssh/ray-autoscaler-v1-east.pem
  ssh_user: ubuntu
available_node_types:
  head_default:
    resources: {"CPU": 0}
    node_config:
      KeyName: ray-autoscaler-v1-east
      InstanceType: i4i.32xlarge
      ImageId: ami-085ad6ae776d8f09c
      IamInstanceProfile:
        Arn: arn:aws:iam::896129387501:instance-profile/ray-worker-v1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 150
            VolumeType: gp3
      TagSpecifications:
        - ResourceType: instance
          Tags:
            - Key: Project
              Value: oe-data      


  worker_i4i_32xl:
    min_workers: 0
    max_workers: 16
    resources: {"CPU": 0}
    node_config:
      KeyName: ray-autoscaler-v1-east
      InstanceType: i4i.32xlarge
      ImageId: ami-085ad6ae776d8f09c
      IamInstanceProfile:
        Arn: arn:aws:iam::896129387501:instance-profile/ray-worker-v1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 150
            VolumeType: gp3
      TagSpecifications:
        - ResourceType: instance
          Tags:
            - Key: Project
              Value: oe-data      


